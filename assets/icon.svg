<svg xmlns="http://www.w3.org/2000/svg" width="1024" height="1024" viewBox="0 0 1024 1024">
  <!-- App tile: the heart-icon design inside a rounded square (tile from 38 to 986). -->
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#04291f"/>
      <stop offset=".55" stop-color="#0b7a52"/>
      <stop offset="1" stop-color="#3fe3a2"/>
    </linearGradient>
    <clipPath id="tile"><rect x="38" y="38" width="948" height="948" rx="212"/></clipPath>
  </defs>
  <g clip-path="url(#tile)">
    <rect width="1024" height="1024" fill="url(#bg)"/>
    <g transform="translate(512 512) scale(.926) translate(-512 -512)">
      <g fill="none" stroke="#ffffff" stroke-linecap="round" stroke-linejoin="round">
        <path d="M 252 710 A 300 300 0 1 1 772 710" stroke-width="88"/>
        <path d="M 512 560 L 630 442" stroke-width="72"/>
      </g>
