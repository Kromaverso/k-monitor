[package]
name = "kmonitor"
version = "0.1.0"
edition = "2021"

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = ["tray-icon", "image-png"] }
tauri-plugin-autostart = "2"
tauri-plugin-single-instance = "2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
parking_lot = "0.12"
sysinfo = "0.33"
nvml-wrapper = "0.10"
dirs = "6"
chrono = { version = "0.4", default-features = false, features = ["std", "clock"] }

[dependencies.windows]
version = "0.58"
features = [
  "Win32_Foundation", "Win32_System_Performance", "Win32_System_Threading", "Win32_Security", "Win32_Globalization", "Win32_Storage_FileSystem", "Win32_System_IO", "Win32_Graphics_Dxgi", "Win32_Graphics_Dxgi_Common",
]

[profile.release]
lto = true
codegen-units = 1
strip = true
opt-level = "s"
panic = "abort"
